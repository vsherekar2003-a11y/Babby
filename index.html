<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  font-family: "Poppins", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 40px 35px;
  border-radius: 20px;
  width: 350px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255,0,100,0.3);
  animation: fadeIn 2s ease;
}

h1 {
  color: #ff4d6d;
  font-size: 28px;
}

p {
  font-size: 18px;
  line-height: 1.6;
  color: #333;
  margin: 20px 0;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 17px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff2e55;
  transform: scale(1.05);
}

#message {
  margin-top: 25px;
  font-size: 20px;
  color: #ff4d6d;
  display: none;
  font-weight: bold;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 22px;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% {
    bottom: -10%;
    opacity: 1;
  }
  100% {
    bottom: 110%;
    opacity: 0;
  }
}

</style>
</head>

<body>

<div class="card">

  <h1>Hey My Love ❤️</h1>

  <p>
    Thank you for making an effort.<br>
    It truly means a lot to me.
  </p>

  <p>
    I appreciate you more than you know,<br>
    and I’m really lucky to have you.
  </p>

  <p>
    So…
  </p>

  <h2 style="color:#ff4d6d;">
    Will you be my Valentine? 💕
  </h2>

  <button onclick="sayYes()">Yes, Always 😘</button>

  <div id="message">
    I’d love to be your Valentine ❤️💍
  </div>

</div>

<script>

function sayYes() {
  document.getElementById("message").style.display = "block";
  createHearts();
}

/* Hearts animation */
function createHearts() {
  for (let i = 0; i < 40; i++) {

    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
      Math.random() * 2 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }
}

</script>

</body>
</html>
